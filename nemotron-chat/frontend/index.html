<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nemotron</title>
<link rel="stylesheet" href="style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</head>
<body>

<div class="app">

  <aside class="rail">
    <div class="rail-top">
      <div class="brand">
        <span class="brand-mark">N</span>
        <div class="brand-text">
          <span class="brand-name">NEMOTRON</span>
          <span class="brand-sub" id="model-name">3.5-lightning-30b</span>
        </div>
      </div>
    </div>

    <button class="new-chat-btn" id="new-chat">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      New session
    </button>

    <div class="rail-section">
      <span class="rail-label">Status</span>
      <div class="status-row">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">ready</span>
      </div>
    </div>

    <div class="rail-footer">
      <span class="rail-hint">Files stay local to this server.<br>Nothing is stored between sessions.</span>
    </div>
  </aside>

  <main class="chat-wrap">

    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <div class="empty-mark">N</div>
        <h1>Nemotron console</h1>
        <p>Ask a question, drop in a doc, or attach an image for context.</p>
      </div>
    </div>

    <div class="composer">
      <div class="attachments" id="attachments"></div>

      <div class="input-bar">
        <button class="icon-btn" id="attach-btn" title="Attach file">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input type="file" id="file-input" hidden multiple accept=".pdf,.docx,.txt,.md,.csv,.json,.png,.jpg,.jpeg,.gif,.webp" />

        <textarea id="prompt" placeholder="Message Nemotron…" rows="1"></textarea>

        <button class="send-btn" id="send-btn" title="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
      <div class="composer-hint">Enter to send · Shift+Enter for a new line</div>
    </div>

  </main>
</div>

<script src="app.js"></script>
</body>
</html>
